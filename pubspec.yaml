name: kisan_dost
description: Kisan Dost - Pakistan Agritech App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  provider: ^6.1.2
  go_router: ^14.3.0
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  url_launcher: ^6.3.1
  http: ^1.2.2
  flutter_image_compress: ^2.3.0
  device_info_plus: ^10.1.2 
  uuid: ^4.5.1            
  path: ^1.9.0
  path_provider: ^2.1.4
  minio: ^3.5.8
  crypto: ^3.0.7
  pdf: ^3.10.8
  printing: ^5.12.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  package_info_plus: ^9.0.1
  video_player: ^2.9.2  # ← ADD
  chewie: ^1.7.5       # Optional — controls ke liye
  flutter_cache_manager: ^3.4.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/images/crops/
    - assets/images/navigation/

  fonts:
    - family: Nastaleeq
      fonts:
        - asset: assets/fonts/JameelNoriNastleeq.TTF

    - family: Noto
      fonts:
        - asset: assets/fonts/NafeeesWeb.ttf
    - family: Inter      
      fonts:
      - asset: assets/fonts/inter.ttf